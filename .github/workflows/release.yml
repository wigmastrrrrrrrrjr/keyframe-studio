name: Publish Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.9.0)'
        required: true
      title:
        description: 'Release title'
        required: false
        default: 'Keyframe Studio'
      prerelease:
        description: 'Mark as pre-release (true/false)'
        required: false
        default: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Create release and attach APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          TITLE: ${{ inputs.title }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=""
          [ "$PRERELEASE" = "true" ] && FLAGS="--prerelease"
          gh release create "$TAG" \
            --title "$TITLE $TAG" \
            --notes "Pre-release build of Keyframe Studio for Android. Install by sideloading the APK (allow installs from unknown sources)." \
            $FLAGS \
            app/build/outputs/apk/release/app-release.apk
